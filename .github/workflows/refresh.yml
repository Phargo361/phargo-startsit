name: Refresh start/sit board

on:
  # All crons are UTC. Window target = 5am-8pm America/Chicago (Central).
  # Baseline is hourly year-round (covers preseason NOW + overnight in-season).
  # In-season (Sep-Feb) two extra crons add :22/:37/:52 during the 5am-8pm CT
  # window, split by month to stay correct across the Nov-1 CDT->CST change.
  schedule:
    - cron: "7 * * * *"                          # hourly, every day (baseline)
    - cron: "22,37,52 0,10-23 * 9,10 *"          # Sep-Oct (CDT, UTC-5): 5am-8pm CT -> 15-min
    - cron: "22,37,52 0,1,11-23 * 11,12,1,2 *"   # Nov-Feb (CST, UTC-6): 5am-8pm CT -> 15-min
  workflow_dispatch:                             # manual run button in the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-board
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild board from live Sleeper data
        run: |
          python tools/collect_sleeper.py
          python tools/board_build.py
      - name: Commit & push if the board changed
        run: |
          git config user.name "startsit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change in board — nothing to publish."
          else
            git commit -m "Auto-refresh board $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "Published refreshed board."
          fi
