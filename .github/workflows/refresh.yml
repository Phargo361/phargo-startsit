name: Refresh start/sit board

on:
  schedule:
    - cron: "12 11 * * *"     # daily, ~11:12 UTC (off-peak)
  workflow_dispatch:           # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-board
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild board from live Sleeper data
        run: |
          python tools/collect_sleeper.py
          python tools/board_build.py
      - name: Commit & push if the board changed
        run: |
          git config user.name "startsit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change in board — nothing to publish."
          else
            git commit -m "Auto-refresh board $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "Published refreshed board."
          fi
